<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickMart - Cart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            QuickMart
        </div>

        <button onclick="goHome()">
            Home
        </button>

        <button onclick="goProducts()">
            Products
        </button>

    </header>


    <!-- CART -->
    <main>

        <section class="cart-container">

            <h1>🛒 My Cart</h1>

            <div id="cartItems">
                <!-- Cart products will appear here -->
            </div>

            <div id="emptyCart">
                Your cart is empty.
            </div>


            <!-- TOTAL -->
            <div class="cart-summary">

                <h3>
                    Subtotal:
                    ₹<span id="subtotal">0</span>
                </h3>

                <h3>
                    Delivery Fee:
                    ₹<span id="deliveryFee">20</span>
                </h3>

                <h2>
                    Total:
                    ₹<span id="total">0</span>
                </h2>

                <button onclick="proceedToCheckout()">
                    Proceed to Checkout
                </button>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
