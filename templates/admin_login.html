<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickMart - Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<header>

    <div class="logo">
        QuickMart Admin
    </div>

</header>


<main>

    <section class="checkout-container">

        <h1>
            Admin Login
        </h1>


        <div class="checkout-section">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                autocomplete="username"
            >


            <label for="password">
                Admin Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
            >


            <button
                type="button"
                class="place-order-btn"
                id="loginButton"
                onclick="adminLogin()"
            >
                Admin Login
            </button>


            <p id="message"></p>

        </div>

    </section>

</main>


<script>

async function adminLogin() {

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    const loginButton =
        document.getElementById("loginButton");


    // Check empty fields
    if (!email || !password) {

        message.textContent =
            "Please enter admin email and password.";

        message.style.color = "red";

        return;
    }


    try {

        // Disable button while login is processing
        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        const response =
            await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


        const result =
            await response.json();


        // Successful login
        if (response.ok && result.success) {

            message.textContent =
                "Admin login successful!";

            message.style.color = "green";


            // Redirect to admin dashboard
            setTimeout(function() {

                window.location.href =
                    "/admin/dashboard";

            }, 500);


            return;
        }


        // Login failed
        message.textContent =
            result.message ||
            "Invalid admin email or password.";

        message.style.color = "red";


        loginButton.disabled = false;

        loginButton.textContent =
            "Admin Login";


    } catch (error) {

        console.error(
            "Admin Login Error:",
            error
        );


        message.textContent =
            "Unable to connect to server.";

        message.style.color = "red";


        loginButton.disabled = false;

        loginButton.textContent =
            "Admin Login";
    }

}


// Allow Enter key to login
document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            adminLogin();

        }

    }
);

</script>


</body>

</html>
