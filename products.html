<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickMart - Products</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header>

        <div class="logo">
            QuickMart
        </div>

        <div class="location">
            📍 Deliver to your location
        </div>

        <input
            type="text"
            id="searchBox"
            placeholder="Search for groceries..."
        >

        <button onclick="goHome()">
            Home
        </button>

        <button onclick="window.location.href='/cart'">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

    </header>


    <!-- =========================
         PRODUCTS
         ========================= -->

    <main>

        <section class="products-section">

            <h1>
                All Products
            </h1>

            <p>
                Choose your favorite groceries
            </p>


            <!-- CATEGORIES -->

            <div class="categories">

                <button onclick="loadProducts()">
                    All
                </button>

                <button onclick="loadCategory('Fruits')">
                    🍎 Fruits
                </button>

                <button onclick="loadCategory('Vegetables')">
                    🥦 Vegetables
                </button>

                <button onclick="loadCategory('Dairy')">
                    🥛 Dairy
                </button>

                <button onclick="loadCategory('Snacks')">
                    🍪 Snacks
                </button>

                <button onclick="loadCategory('Beverages')">
                    🧃 Beverages
                </button>

                <button onclick="loadCategory('Household')">
                    🧹 Household
                </button>

            </div>


            <!-- PRODUCT CONTAINER -->

            <div
                id="productContainer"
                class="product-container">
            </div>


            <!-- NO PRODUCTS -->

            <p
                id="noProducts"
                style="display: none;">

                No products found.

            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer>

        <p>
            © 2026 QuickMart. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
